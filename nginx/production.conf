# Production vhost. Reached only through the `cloudflared` tunnel container
# on the internal Docker network — TLS terminates at Cloudflare's edge, so
# this server block stays plain HTTP on purpose.

limit_req_zone $binary_remote_addr zone=wplogin:10m rate=5r/m;

server {
    client_max_body_size 15M;
    listen 80;
    server_name _;
    server_tokens off;

    root /var/www/html;
    index index.php index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # cloudflared is the only client that ever reaches this container, and it
    # sets CF-Connecting-IP to the real visitor IP. Trust it so logs and WP
    # see the real address instead of the tunnel's internal one. Adjust the
    # subnet if your Docker network isn't in the default bridge range
    # (`docker network inspect <network>` to check).
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /wp-login.php {
        limit_req zone=wplogin burst=3 nodelay;
        include        fastcgi_params;
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO $fastcgi_path_info;
    }

    location ~ \.php$ {
        include        fastcgi_params;
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Security: prevent PHP execution on uploads
        fastcgi_param  PATH_INFO $fastcgi_path_info;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|otf)$ {
        expires max;
        log_not_found off;
    }

    # Block access to sensitive WordPress files
    location ~* /(?:wp-config\.php|readme\.html|license\.txt|xmlrpc\.php) {
        deny all;
    }

    location ~ /\.ht {
        deny all;
    }

    # Prevent PHP execution inside uploads
    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
    }
}
